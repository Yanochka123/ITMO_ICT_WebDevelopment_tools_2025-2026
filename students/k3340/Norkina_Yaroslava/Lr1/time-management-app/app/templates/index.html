<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Management App</title>
</head>
<body>
    <div style="max-width: 800px; margin: 50px auto; padding: 20px; font-family: Arial;">
        <h1>⏰ Time Management App</h1>
        <p>Добро пожаловать! Приложение работает.</p>
        
        <div id="auth-section">
            <h2>Вход в систему</h2>
            <input type="email" id="login-email" placeholder="Email" style="display:block; margin:10px 0; padding:8px; width:200px;">
            <input type="password" id="login-password" placeholder="Password" style="display:block; margin:10px 0; padding:8px; width:200px;">
            <button onclick="login()" style="padding:8px 20px; background:#667eea; color:white; border:none; border-radius:5px; cursor:pointer;">Login</button>
            <button onclick="showRegister()" style="padding:8px 20px; background:#764ba2; color:white; border:none; border-radius:5px; cursor:pointer; margin-left:10px;">Register</button>
        </div>

        <div id="register-form" style="display:none;">
            <h2>Регистрация</h2>
            <input type="text" id="reg-username" placeholder="Username" style="display:block; margin:10px 0; padding:8px; width:200px;">
            <input type="email" id="reg-email" placeholder="Email" style="display:block; margin:10px 0; padding:8px; width:200px;">
            <input type="password" id="reg-password" placeholder="Password" style="display:block; margin:10px 0; padding:8px; width:200px;">
            <button onclick="register()" style="padding:8px 20px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">Register</button>
            <button onclick="showLogin()" style="padding:8px 20px; background:#6c757d; color:white; border:none; border-radius:5px; cursor:pointer; margin-left:10px;">Back</button>
        </div>

        <div id="user-info" style="display:none;">
            <p>Вы вошли как: <span id="username-display"></span></p>
            <button onclick="logout()" style="padding:8px 20px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">Logout</button>
        </div>

        <div id="stats-section" style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin:30px 0;">
            <div style="background:#667eea; color:white; padding:20px; border-radius:10px; text-align:center;">
                <h3>Total</h3>
                <p id="total-tasks" style="font-size:24px;">0</p>
            </div>
            <div style="background:#28a745; color:white; padding:20px; border-radius:10px; text-align:center;">
                <h3>Completed</h3>
                <p id="completed-tasks" style="font-size:24px;">0</p>
            </div>
            <div style="background:#ffc107; color:black; padding:20px; border-radius:10px; text-align:center;">
                <h3>Pending</h3>
                <p id="pending-tasks" style="font-size:24px;">0</p>
            </div>
            <div style="background:#dc3545; color:white; padding:20px; border-radius:10px; text-align:center;">
                <h3>Due Today</h3>
                <p id="due-today" style="font-size:24px;">0</p>
            </div>
        </div>

        <div id="task-section">
            <h2>Add New Task</h2>
            <form id="task-form" style="display:grid; gap:10px; max-width:400px;">
                <input type="text" id="task-title" placeholder="Task title" required style="padding:8px;">
                <textarea id="task-description" placeholder="Description" style="padding:8px; min-height:60px;"></textarea>
                <select id="task-priority" style="padding:8px;">
                    <option value="1">Priority 1 (Low)</option>
                    <option value="2">Priority 2</option>
                    <option value="3" selected>Priority 3</option>
                    <option value="4">Priority 4</option>
                    <option value="5">Priority 5 (High)</option>
                </select>
                <input type="datetime-local" id="task-due-date" style="padding:8px;">
                <button type="submit" style="padding:10px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">Add Task</button>
            </form>
        </div>

        <div id="tasks-list">
            <h2>Your Tasks</h2>
            <div id="tasks-container"></div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        
        if (token) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('user-info').style.display = 'block';
            loadTasks();
            loadStats();
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('user-info').style.display = 'block';
                    loadTasks();
                    loadStats();
                    alert('Login successful!');
                } else {
                    alert('Login failed');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, email, password })
                });
                
                if (response.ok) {
                    alert('Registration successful! Please login.');
                    showLogin();
                } else {
                    const error = await response.json();
                    alert('Registration failed: ' + error.detail);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function showRegister() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('token');
            token = null;
            document.getElementById('user-info').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('tasks-container').innerHTML = '';
        }

        async function loadTasks() {
            try {
                const response = await fetch('/tasks/', {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    const tasks = await response.json();
                    displayTasks(tasks);
                } else if (response.status === 401) {
                    logout();
                }
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/tasks/stats', {
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    const stats = await response.json();
                    document.getElementById('total-tasks').textContent = stats.total;
                    document.getElementById('completed-tasks').textContent = stats.completed;
                    document.getElementById('pending-tasks').textContent = stats.pending;
                    document.getElementById('due-today').textContent = stats.due_today;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function displayTasks(tasks) {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            
            tasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.style.cssText = 'background:#f8f9fa; padding:15px; margin:10px 0; border-radius:10px; border-left:5px solid ' + 
                    (task.status === 'completed' ? '#28a745' : '#667eea') + ';';
                
                taskElement.innerHTML = `
                    <div>
                        <h3>${task.title}</h3>
                        <p>${task.description || 'No description'}</p>
                        <small>Priority: ${task.priority} | Status: ${task.status}</small>
                        ${task.time_spent > 0 ? `<small> | Time: ${task.time_spent.toFixed(1)}h</small>` : ''}
                    </div>
                    <div>
                        ${task.status !== 'completed' ? 
                            `<button onclick="completeTask(${task.id})" style="padding:5px 15px; background:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">Complete</button>` : 
                            ''}
                        <button onclick="deleteTask(${task.id})" style="padding:5px 15px; background:#dc3545; color:white; border:none; border-radius:5px; cursor:pointer;">Delete</button>
                    </div>
                `;
                container.appendChild(taskElement);
            });
        }

        document.getElementById('task-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;
            const priority = parseInt(document.getElementById('task-priority').value);
            const due_date = document.getElementById('task-due-date').value;
            
            try {
                const response = await fetch('/tasks/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, description, priority, due_date: due_date || null })
                });
                
                if (response.ok) {
                    this.reset();
                    loadTasks();
                    loadStats();
                } else {
                    alert('Failed to add task');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        async function completeTask(taskId) {
            try {
                const response = await fetch(`/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: 'completed' })
                });
                
                if (response.ok) {
                    loadTasks();
                    loadStats();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteTask(taskId) {
            if (!confirm('Delete this task?')) return;
            
            try {
                const response = await fetch(`/tasks/${taskId}`, {
                    method: 'DELETE',
                    headers: {'Authorization': `Bearer ${token}`}
                });
                
                if (response.ok) {
                    loadTasks();
                    loadStats();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
