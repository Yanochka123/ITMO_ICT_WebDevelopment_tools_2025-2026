<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Management App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Time Management App</h1>
            <nav>
                <a href="/docs" target="_blank">API Документация</a>
                <a href="/health">Health Check</a>
                <button id="logoutBtn" style="display:none;">Выйти</button>
            </nav>
        </header>

        <main>
            <!-- ===== Форма логина (показывается, если нет токена) ===== -->
            <section class="login-section" id="loginSection">
                <h2>Вход в систему</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="user@example.com"
                            value="user@example.com"
                            required
                            autocomplete="username"
                        >
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Введите пароль"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    <button type="submit" class="btn-primary">Войти</button>
                    <p class="error" id="loginError" style="display:none;"></p>
                </form>
            </section>

            <!-- ===== Основной контент (показывается после логина) ===== -->
            <div id="appContent" style="display:none;">
                <section class="stats-section">
                    <h2>Статистика задач</h2>
                    <div class="stats-grid" id="statsGrid">
                        <div class="stat-card">
                            <span class="stat-value" id="totalTasks">0</span>
                            <span class="stat-label">Всего задач</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="completedTasks">0</span>
                            <span class="stat-label">Выполнено</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="inProgressTasks">0</span>
                            <span class="stat-label">В процессе</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="pendingTasks">0</span>
                            <span class="stat-label">Ожидает</span>
                        </div>
                    </div>
                </section>

                <section class="tasks-section">
                    <h2>Список задач</h2>
                    <div class="tasks-list" id="tasksList">
                        <p class="loading">Загрузка задач...</p>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>© 2026 Time Management App | Built with FastAPI</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
